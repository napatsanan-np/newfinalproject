name: CI - Go Unit Tests

on:
  push:
    branches: ["main"]
    paths:
      - "Examroom-space/Backend/**"
      - ".github/workflows/**"
  pull_request:
    branches: ["main"]
    paths:
      - "Examroom-space/Backend/**"
      - ".github/workflows/**"

jobs:
  unit-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run unit tests
        working-directory: Examroom-space/Backend
        run: go test -v ./...
