name: CI Docker + Playwright

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ไม่ต้อง cache เพื่อตัดปัญหาเดิมออกให้จบ
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # ติดตั้ง dependency สำหรับรัน Playwright (เฉพาะฝั่ง test)
      - name: Install dependencies (Fontend)
        working-directory: Fontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: Fontend
        run: npx playwright install --with-deps

      # สตาร์ทระบบเหมือนที่คุณรันจริง
      - name: Build & Start Docker Compose
        run: docker compose up -d --build

      # รอให้หน้าเว็บขึ้น (ปรับ URL ตามพอร์ตจริงของคุณ)
      - name: Wait for Frontend
        working-directory: Fontend
        run: npx wait-on http://127.0.0.1:3000

      - name: Run Playwright tests
        working-directory: Fontend
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: Fontend/playwright-report/

      # กัน resource ค้าง
      - name: Docker logs (on failure)
        if: failure()
        run: docker compose logs --no-color

      - name: Shutdown
        if: always()
        run: docker compose down
