name: CI Docker + Playwright

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # ติดตั้ง dependency สำหรับ playwright (จาก root)
      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # สตาร์ทระบบด้วย docker-compose แบบที่คุณใช้จริง
      - name: Build & Start Docker Compose
        run: docker compose up -d --build

      # รอให้เว็บขึ้น (แก้ port ถ้าไม่ใช่ 3000)
      - name: Wait for Frontend
        run: npx wait-on http://127.0.0.1:3000

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

      - name: Docker logs (on failure)
        if: failure()
        run: docker compose logs --no-color

      - name: Shutdown
        if: always()
        run: docker compose down
