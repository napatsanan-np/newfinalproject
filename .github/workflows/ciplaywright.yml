name: CI Docker + Playwright (Examroom-space)
#กำหนด “เหตุการณ์” ที่จะให้ workflow ทำงาน
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
#กำหนด “งาน” ที่จะให้ workflow ทำงาน
jobs:
  e2e:
    #รันงานบน Ubuntu ล่าสุด
    runs-on: ubuntu-latest
    #ขั้นตอนในการรันงาน
    steps:
        #ดึง source code จาก repo มาไว้ใน runner
        #runner คือ environment ชั่วคราวที่ GitHub สร้างขึ้นมาเพื่อรัน workflow
      - name: Checkout
        uses: actions/checkout@v4
        #ตรวจโครงสร้างโปรเจค เพื่อกัน path ผิด ชื่อ โฟดเดอร์ ผิด
      - name: Verify project structure
        #พิมพ์หัวข้อว่า “Repo root” เพื่อแบ่ง section ใน log
        #แสดงรายการไฟล์/โฟลเดอร์ที่ root ของ runner ณ ตอนนั้น
        #พิมพ์หัวข้อ section “Examroom-space”
        #แสดงรายการในโฟลเดอร์ Examroom-space
        #พิมพ์หัวข้อ section “Fontend”
        #แสดงรายการในโฟลเดอร์ Frontend ของคุณ
        #เช็คว่ามีไฟล์ package.json จริงไหม test -f จะคืนค่า 0 ถ้ามีไฟล์นั้นอยู่
        #เช็คว่ามี package-lock.json จริงไหม
        #เช็คว่ามี config ของ Playwright อยู่จริงไหม
        #เช็คว่า มี docker-compose.yml อยู่จริงไหม
        run: |
          echo "=== Repo root ==="
          ls -la
          echo "=== Examroom-space ==="
          ls -la Examroom-space
          echo "=== Fontend ==="
          ls -la Examroom-space/Fontend
          test -f Examroom-space/Fontend/package.json
          test -f Examroom-space/Fontend/package-lock.json
          test -f Examroom-space/Fontend/playwright.config.mjs
          test -f Examroom-space/docker-compose.yml
        #ตั้งค่า Node.js ให้พร้อมใช้ npm/npx เริ่มกำหนดพารามิเตอร์ให้ action เลือกใช้ Node เวอร์ชัน 18
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
        #ติดตั้ง dependencies ของฝั่ง frontend โดยจะมีplaywright/tests
        #ติดตั้ง dependency แบบ “ล็อกเวอร์ชันตาม package-lock.json” เพื่อความเสถียร
      - name: Install dependencies (Fontend)
        working-directory: Examroom-space/Fontend
        run: npm ci
        #ติดตั้ง browser ที่ Playwright ใช้ทดสอบ ลง dependency ฝั่ง Linux ให้ครบถ้วน
      - name: Install Playwright browsers
        working-directory: Examroom-space/Fontend
        run: npx playwright install --with-deps
        #อันนี้จะเป็นการ build docker image ของ backend และ frontend
      - name: Build backend Docker image
        working-directory: Examroom-space/Backend
        run: docker build -t local/backend:fixed .

      - name: Build frontend Docker image
        working-directory: Examroom-space/Fontend
        run: docker build -t local/frontend:fixed .   
        #สตาร์ท docker compose ขึ้นมา
      - name: start Docker Compose
        working-directory: Examroom-space
        run: docker compose up -d    
        #รอให้เว็บหน้า frontend พร้อมใช้งาน ก่อนเริ่มเทส
        #รอHTTP พร้อมใช้งานที่ URL http://
      - name: Wait for Frontend
        working-directory: Examroom-space/Fontend
        run: npx wait-on http://127.0.0.1:3000
        #รันชุดทดสอบ Playwright
        #จะสั่งรันทุกเทสต์ที่อยู่ในโฟลเดอร์ tests
      - name: Run Playwright tests
        working-directory: Examroom-space/Fontend
        run: npx playwright test
        #ถ้าเทสต์ล้มเหลว ให้เก็บรายงานผลการทดสอบไว้เป็นอาร์ติแฟกต์
        #if: failure() จะทำให้ขั้นตอนนี้รันเฉพาะเมื่อขั้นตอนก่อนหน้าล้มเหลว
        #path: Examroom-space/Fontend/playwright-report/ คือที่เก็บรายงานผลการทดสอบ
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: Examroom-space/Fontend/playwright-report/
        #ถ้าเทสต์ล้มเหลว ให้แสดง log ของ docker compose เพื่อช่วยวิเคราะห์ปัญหา
      - name: Docker logs (on failure)
        if: failure()
        working-directory: Examroom-space
        run: docker compose -f docker-compose.yml logs --no-color
        #ปิด docker compose ไม่ว่าจะผ่านหรือ fail ก็ตาม
      - name: Shutdown
        if: always()
        working-directory: Examroom-space
        run: docker compose -f docker-compose.yml down
