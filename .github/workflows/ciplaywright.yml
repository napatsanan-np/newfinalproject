name: CI Docker + Playwright (Examroom-space)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify project structure
        run: |
          echo "=== Repo root ==="
          ls -la
          echo "=== Examroom-space ==="
          ls -la Examroom-space
          echo "=== Fontend ==="
          ls -la Examroom-space/Fontend
          test -f Examroom-space/Fontend/package.json
          test -f Examroom-space/Fontend/package-lock.json
          test -f Examroom-space/Fontend/playwright.config.mjs
          test -f Examroom-space/docker-compose.yml

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies (Fontend)
        working-directory: Examroom-space/Fontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: Examroom-space/Fontend
        run: npx playwright install --with-deps

      - name: Build backend Docker image
        working-directory: Examroom-space/Backend
        run: docker build -t local/backend:fixed .

      - name: Build frontend Docker image
        working-directory: Examroom-space/Fontend
        run: docker build -t local/frontend:fixed .   
        
      - name: start Docker Compose
        working-directory: Examroom-space
        run: docker-compose up -d    

      - name: Wait for Frontend
        working-directory: Examroom-space/Fontend
        run: npx wait-on http://127.0.0.1:3000

      - name: Run Playwright tests
        working-directory: Examroom-space/Fontend
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: Examroom-space/Fontend/playwright-report/

      - name: Docker logs (on failure)
        if: failure()
        working-directory: Examroom-space
        run: docker compose -f docker-compose.yml logs --no-color

      - name: Shutdown
        if: always()
        working-directory: Examroom-space
        run: docker compose -f docker-compose.yml down
