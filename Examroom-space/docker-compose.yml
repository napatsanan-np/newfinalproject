

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./ssl:/etc/nginx/ssl  
    depends_on:
      - frontend
      - backend
    networks:
      - app_network
    restart: always
    
  db:
    build: ./Database
    container_name: examroom_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT}:5432"
    restart: unless-stopped
    networks:
      - app_network
  frontend:
    image: local/frontend:fixed
    ports:
    - "3000:80"        # นำพอร์ต 80 ใน container มาเปิดที่พอร์ต 3000 บนเครื่องจริง
    networks:
    - app_network
    restart: always

  

  pgadmin:
    image: dpage/pgadmin4
    container_name:  examroom_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "${PGADMIN_PORT}:80"
    restart: unless-stopped

    depends_on:
      - db
    networks:
      - app_network

  backend:
    image: local/backend:fixed
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: ${POSTGRES_PORT}
      URL_FONTEND: ${URL_FONTEND}
      POSTGRES_HOST: ${POSTGRES_HOST}
      JWT_SECRET: ${JWT_SECRET}

      # SSO Config 
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET}
      AZURE_REDIRECT_URL: ${AZURE_REDIRECT_URL}

      # Database Connection Pool Settings
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-25}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-10}
      DB_CONN_LIFETIME_MINUTES: ${DB_CONN_LIFETIME_MINUTES:-5}
      DB_IDLE_TIMEOUT_SECONDS: ${DB_IDLE_TIMEOUT_SECONDS:-30}

    expose:
      - "8080"
    networks:
      - app_network
    restart: always
    ports:
      - "${API_PORT}:8080"
    depends_on:
      - db



networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data: 
